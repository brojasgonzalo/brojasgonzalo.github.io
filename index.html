<style>
  :root{

  .intro{

  h1{

  .subtitle{

  p{

  p a{

  .contact{

    flex-wrap:wrap;

  }
  .contact a{
    display:inline-flex;
    align-items:center;
    gap:0.5em;
    color:var(--ink-soft);
    text-decoration:none;
    font-size:0.85rem;
    letter-spacing:0.02em;

  .contact a:hover{

  .contact svg{

    height:15px;
    flex-shrink:0;
  }

  a:focus-visible{outline:1px solid var(--ink-soft); outline-offset:4px;}

<body>

<canvas id="net"></canvas>

<main>
  <div class="intro">
    <h1>Gonzalo Bustamante Rojas</h1>

        CIPER

</main>

<script>
(function(){
  var canvas = document.getElementById('net');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W, H, DPR;
  var nodes = [];
  var mouse = { x: -9999, y: -9999, active: false };

  // Enjambre disperso, no átomos: cada nodo trae su propio movimiento de
  // base (dirección aleatoria fija), y solo se repelen entre sí a muy
  // corta distancia para no encimarse — sin atracción, así que no se
  // arman cúmulos estables. Las líneas se dibujan cuando dos nodos pasan
  // cerca por casualidad, no porque estén "enlazados".
  var REPEL_RADIUS_NODE = 60;  // distancia a la que dos nodos se repelen
  var REPEL_FORCE = 0.03;      // empuje al repelerse
  var LINK_DIST = 120;         // distancia para dibujar línea entre nodos
  var DAMPING = 0.985;         // fricción baja — el movimiento de base persiste
  var MAX_SPEED = 0.5;         // tope de velocidad — bastante más calmado
  var ANGLE_JITTER = 0.03;     // qué tan rápido gira el rumbo — bajo, para que sea suave
  var WANDER_FORCE = 0.005;    // empuje continuo en la dirección del rumbo actual — mucho más suave

  var REPEL_RADIUS = 130;      // radio de perturbación del cursor
  var REPEL_STRENGTH = 0.9;    // impulso del cursor (empuja, no atrae)

  function nodeCount(){
    var area = window.innerWidth * window.innerHeight;
    return Math.max(220, Math.min(450, Math.round(area / 4500)));
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function makeNodes(){
    var n = nodeCount();
    nodes = [];
    for (var i = 0; i < n; i++){
      nodes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: 0,
        vy: 0,
        angle: Math.random() * Math.PI * 2,
        r: 1 + Math.random() * 1.2
      });
    }
  }

  function step(){
    ctx.clearRect(0, 0, W, H);

    // un solo recorrido por cada par: calcula la fuerza entre ambos
    // nodos y, si están lo bastante cerca, dibuja la línea que los une
    // (la línea es literalmente "acá hay una fuerza actuando").
    ctx.lineWidth = 1;
    for (var i = 0; i < nodes.length; i++){
      var a = nodes[i];
      for (var j = i + 1; j < nodes.length; j++){
        var b = nodes[j];
        var dx = b.x - a.x, dy = b.y - a.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.001 || dist > LINK_DIST) continue;

        // solo repulsión, y solo a muy corta distancia — sin atracción
        // no hay nada que arme cúmulos estables
        if (dist < REPEL_RADIUS_NODE){
          var nx = dx / dist, ny = dy / dist;
          var f = -((REPEL_RADIUS_NODE - dist) / REPEL_RADIUS_NODE) * REPEL_FORCE;
          a.vx += nx * f; a.vy += ny * f;
          b.vx -= nx * f; b.vy -= ny * f;
        }

        var op = (1 - dist / LINK_DIST) * 0.16;
        var key = (i * 7 + j * 13) % 10;
        var rgb = key < 8 ? '237,236,230' : (key === 8 ? '138,164,214' : '196,150,120');
        ctx.strokeStyle = 'rgba(' + rgb + ',' + op.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }

    // integración: deriva suave de rumbo (no ruido puro — el ángulo gira
    // apenas cada frame, como una corriente que cambia de a poco, no
    // como una partícula vibrando al azar), perturbación del cursor,
    // fricción, tope de velocidad, y avance de posición
    for (var i = 0; i < nodes.length; i++){
      var a = nodes[i];

      a.angle += (Math.random() - 0.5) * ANGLE_JITTER;
      a.vx += Math.cos(a.angle) * WANDER_FORCE;
      a.vy += Math.sin(a.angle) * WANDER_FORCE;

      if (mouse.active){
        var mdx = a.x - mouse.x, mdy = a.y - mouse.y;
        var mdist = Math.sqrt(mdx * mdx + mdy * mdy);
        if (mdist < REPEL_RADIUS && mdist > 0.001){
          var mforce = (1 - mdist / REPEL_RADIUS) * REPEL_STRENGTH;
          a.vx += (mdx / mdist) * mforce * 0.08;
          a.vy += (mdy / mdist) * mforce * 0.08;
        }
      }

      a.vx *= DAMPING; a.vy *= DAMPING;
      var speed = Math.sqrt(a.vx * a.vx + a.vy * a.vy);
      if (speed > MAX_SPEED){ a.vx = (a.vx / speed) * MAX_SPEED; a.vy = (a.vy / speed) * MAX_SPEED; }

      a.x += a.vx; a.y += a.vy;

      if (a.x < -10) a.x = W + 10;
      if (a.x > W + 10) a.x = -10;
      if (a.y < -10) a.y = H + 10;
      if (a.y > H + 10) a.y = -10;
    }

    // nodos
    ctx.fillStyle = 'rgba(237,236,230,0.55)';
    for (var i = 0; i < nodes.length; i++){
      var a = nodes[i];
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!reduceMotion) requestAnimationFrame(step);
  }

  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });
  window.addEventListener('mouseleave', function(){
    mouse.active = false;
  });

  window.addEventListener('resize', function(){
    resize();
    makeNodes();
    if (reduceMotion) step();
  });

  resize();
  makeNodes();
  step();
})();
</script>

</body>
</html>
