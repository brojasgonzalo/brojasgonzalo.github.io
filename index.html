<style>
  :root{
    --bg:#0A0B0E;
    --ink:#EDECE6;
    --ink-soft:#8B8C92;
    --line:#EDECE6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);

  canvas#net{
    position:fixed;
    inset:0;
    width:100%;

    pointer-events:none;
  }

  main{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;

    padding:8vh 8vw;

  .intro{

  h1{
    font-weight:500;
    font-size:clamp(1.7rem, 3.4vw, 2.35rem);

  .subtitle{

  p a{

  }
  p a:hover{opacity:0.6;}

  .contact{
    margin-top:2.6em;
    display:flex;
    flex-wrap:wrap;
    gap:1.4em;
  }
  .contact a{
    display:inline-flex;
    align-items:center;
    gap:0.5em;
    color:var(--ink-soft);
    text-decoration:none;
    font-size:0.85rem;
    letter-spacing:0.02em;
    border-bottom:1px solid transparent;
    transition:color 0.2s, border-color 0.2s;
  }
  .contact a:hover{

  }
  .contact svg{
    width:15px;
    height:15px;
    flex-shrink:0;
  }

  a:focus-visible{outline:1px solid var(--ink-soft); outline-offset:4px;}

<body>

<canvas id="net"></canvas>

<main>
  <div class="intro">

        CIPER

</main>

<script>
(function(){
  var canvas = document.getElementById('net');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W, H, DPR;
  var nodes = [];
  var mouse = { x: -9999, y: -9999, active: false };

  // Nube de puntos en un espacio 3D real (no simulado): cada nodo tiene
  // x, y, z en unidades de "mundo" independientes de los píxeles de
  // pantalla. Toda la nube gira despacio sobre su eje y responde un
  // poco al cursor (como girar un globo), y cada frame se proyecta con
  // perspectiva real (entre más lejos en z, más chico y más tenue) —
  // por eso el efecto de profundidad no depende de ningún truco visual,
  // es geometría.
  // el volumen 3D se dimensiona en resize() en proporción al viewport,
  // así la nube siempre llena la pantalla en vez de quedar como una
  // esfera chica flotando en el centro
  var HALF_X, HALF_Y, HALF_Z, CAM_DIST, FOCAL;

  // estas cuatro se recalculan en resize() en proporción al tamaño del
  // volumen 3D, para que la densidad de líneas y la velocidad se vean
  // igual sin importar el tamaño de la ventana
  var LINK_DIST, WANDER_FORCE, MAX_SPEED;
  var DAMPING = 0.985;

  var rot = { y: 0, x: 0 };     // ángulo actual de la cámara
  var targetTiltX = 0, targetTiltY = 0;
  var AUTOSPIN = 0.0009;        // giro constante, aun sin mouse

  function nodeCount(){
    var area = window.innerWidth * window.innerHeight;
    return Math.max(60, Math.min(130, Math.round(area / 12000)));
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var minDim = Math.min(W, H);
    HALF_X = W * 0.62;
    HALF_Y = H * 0.62;
    HALF_Z = minDim * 0.62;
    CAM_DIST = minDim * 0.85;
    FOCAL = minDim * 0.95;
    LINK_DIST = minDim * 0.22;
    WANDER_FORCE = minDim * 0.0000045;
    MAX_SPEED = minDim * 0.00045;
  }

  function makeNodes(){
    var n = nodeCount();
    nodes = [];
    for (var i = 0; i < n; i++){
      nodes.push({
        x: (Math.random() * 2 - 1) * HALF_X,
        y: (Math.random() * 2 - 1) * HALF_Y,
        z: (Math.random() * 2 - 1) * HALF_Z,
        vx: 0, vy: 0, vz: 0,
        angle: Math.random() * Math.PI * 2,
        axis: Math.random() * Math.PI * 2,
        r: 1 + Math.random() * 1.3
      });
    }
  }

  // proyecta un punto del mundo 3D (ya rotado) a coordenadas de pantalla
  function project(p){
    var scale = FOCAL / (FOCAL + p.rz + CAM_DIST);
    return {
      x: W / 2 + p.rx * scale,
      y: H / 2 + p.ry * scale,
      scale: scale
    };
  }

  function step(){
    ctx.clearRect(0, 0, W, H);

    rot.y += AUTOSPIN + targetTiltY * 0.002; // giro constante + leve empujón del cursor
    rot.x += (targetTiltX - rot.x) * 0.04;   // inclinación (pitch) sigue al cursor con suavizado

    var cosY = Math.cos(rot.y), sinY = Math.sin(rot.y);
    var cosX = Math.cos(rot.x), sinX = Math.sin(rot.x);

    // integración física en el espacio 3D real (deriva propia + fricción)
    for (var i = 0; i < nodes.length; i++){
      var a = nodes[i];
      a.angle += (Math.random() - 0.5) * 0.03;
      a.axis += (Math.random() - 0.5) * 0.03;
      a.vx += Math.cos(a.angle) * Math.cos(a.axis) * WANDER_FORCE;
      a.vy += Math.sin(a.axis) * WANDER_FORCE;
      a.vz += Math.sin(a.angle) * Math.cos(a.axis) * WANDER_FORCE;

      a.vx *= DAMPING; a.vy *= DAMPING; a.vz *= DAMPING;
      var speed = Math.sqrt(a.vx * a.vx + a.vy * a.vy + a.vz * a.vz);
      if (speed > MAX_SPEED){
        var k = MAX_SPEED / speed;
        a.vx *= k; a.vy *= k; a.vz *= k;
      }

      a.x += a.vx; a.y += a.vy; a.z += a.vz;
      if (a.x < -HALF_X) a.x = -HALF_X, a.vx *= -1;
      if (a.x > HALF_X) a.x = HALF_X, a.vx *= -1;
      if (a.y < -HALF_Y) a.y = -HALF_Y, a.vy *= -1;
      if (a.y > HALF_Y) a.y = HALF_Y, a.vy *= -1;
      if (a.z < -HALF_Z) a.z = -HALF_Z, a.vz *= -1;
      if (a.z > HALF_Z) a.z = HALF_Z, a.vz *= -1;

      // rotación de cámara alrededor de Y y luego de X
      var x1 = a.x * cosY - a.z * sinY;
      var z1 = a.x * sinY + a.z * cosY;
      var y1 = a.y * cosX - z1 * sinX;
      var z2 = a.y * sinX + z1 * cosX;

      a.rx = x1; a.ry = y1; a.rz = z2;
      var proj = project(a);
      a.sx = proj.x; a.sy = proj.y; a.sc = proj.scale;
    }

    // líneas: distancia real en el espacio 3D rotado, así que solo se
    // conectan nodos que de verdad están cerca en profundidad, no solo
    // superpuestos en pantalla
    ctx.lineWidth = 1;
    for (var i = 0; i < nodes.length; i++){
      var a = nodes[i];
      for (var j = i + 1; j < nodes.length; j++){
        var b = nodes[j];
        var dx = a.rx - b.rx, dy = a.ry - b.ry, dz = a.rz - b.rz;
        var dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (dist > LINK_DIST) continue;

        var opScale = (a.sc + b.sc) * 0.5;
        var op = (1 - dist / LINK_DIST) * 0.22 * Math.min(1, opScale * 0.9);
        var key = (i * 7 + j * 13) % 10;
        var rgb = key < 8 ? '237,236,230' : (key === 8 ? '138,164,214' : '196,150,120');
        ctx.strokeStyle = 'rgba(' + rgb + ',' + Math.max(0, op).toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(a.sx, a.sy);
        ctx.lineTo(b.sx, b.sy);
        ctx.stroke();
      }
    }

    // nodos: de atrás hacia adelante, para que los cercanos —agrandados
    // por la perspectiva— tapen a los lejanos, como corresponde en 3D
    var ordered = nodes.slice().sort(function(p, q){ return p.rz - q.rz; });
    for (var i = 0; i < ordered.length; i++){
      var a = ordered[i];
      var alpha = Math.max(0.08, Math.min(0.85, 0.15 + a.sc * 0.55));
      var radius = Math.max(0.4, a.r * a.sc);
      ctx.fillStyle = 'rgba(237,236,230,' + alpha.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(a.sx, a.sy, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!reduceMotion) requestAnimationFrame(step);
  }

  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    targetTiltX = (e.clientY / H - 0.5) * 0.5;
    targetTiltY = (e.clientX / W - 0.5);
  });
  window.addEventListener('mouseleave', function(){
    mouse.active = false;
    targetTiltX = 0;
    targetTiltY = 0;
  });

  window.addEventListener('resize', function(){
    resize();
    makeNodes();
    if (reduceMotion) step();
  });

  resize();
  makeNodes();
  step();
})();
</script>

</body>
</html>
