<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gonzalo Bustamante Rojas</title>
<meta name="description" content="Gonzalo Bustamante Rojas — investigador asociado al Centro de Encuestas y Estudios Longitudinales UC.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B0E;
    --ink:#EDECE6;
    --ink-soft:#8B8C92;
    --line:#EDECE6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Instrument Sans', system-ui, sans-serif;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  canvas#net{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
  }

  main{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:8vh 8vw;
  }

  .intro{
    max-width:34rem;
  }

  h1{
    font-weight:500;
    font-size:clamp(1.7rem, 3.4vw, 2.35rem);
    letter-spacing:-0.01em;
    margin:0 0 1.6em;
    color:var(--ink);
  }

  p{
    font-weight:400;
    font-size:1rem;
    line-height:1.75;
    color:var(--ink-soft);
    margin:0 0 0.9em;
    max-width:32rem;
  }

  p a{
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    transition:opacity 0.2s;
  }
  p a:hover{opacity:0.6;}

  .contact{
    margin-top:2.6em;
    display:flex;
    flex-wrap:wrap;
    gap:1.4em;
  }
  .contact a{
    color:var(--ink-soft);
    text-decoration:none;
    font-size:0.85rem;
    letter-spacing:0.02em;
    border-bottom:1px solid transparent;
    transition:color 0.2s, border-color 0.2s;
  }
  .contact a:hover{
    color:var(--ink);
    border-color:var(--ink-soft);
  }

  a:focus-visible{outline:1px solid var(--ink-soft); outline-offset:4px;}
</style>
</head>
<body>

<canvas id="net"></canvas>

<main>
  <div class="intro">
    <h1>Gonzalo, 29</h1>
    <p>Investigador asociado al <a href="https://encuestas.uc.cl/">Centro de Encuestas y Estudios Longitudinales UC</a>.</p>
    <p>Cientista Familiar (UFT) y Magíster en Sociología (PUC).</p>
    <p>Me gustan los gatos y el shoegaze.</p>

    <div class="contact">
      <a href="mailto:brojasgonzalo@gmail.com">Correo</a>
      <a href="https://github.com/brojasgonzalo">GitHub</a>
      <a href="https://www.linkedin.com/in/gonzalo-b-rojas/">LinkedIn</a>
      <a href="https://www.ciperchile.cl/author/gonzalo-bustamante-rojas/">CIPER</a>
    </div>
  </div>
</main>

<script>
(function(){
  var canvas = document.getElementById('net');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W, H, DPR;
  var nodes = [];
  var mouse = { x: -9999, y: -9999, active: false };

  var LINK_DIST = 130;      // líneas entre nodos hasta esta distancia
  var REPEL_RADIUS = 130;   // radio de perturbación del cursor
  var REPEL_STRENGTH = 28;  // qué tan fuerte empuja (desplazamiento, no atracción)
  var DRIFT = 0.09;         // velocidad ambiental, deliberadamente lenta

  function nodeCount(){
    var area = window.innerWidth * window.innerHeight;
    return Math.max(40, Math.min(110, Math.round(area / 16000)));
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function makeNodes(){
    var n = nodeCount();
    nodes = [];
    for (var i = 0; i < n; i++){
      var angle = Math.random() * Math.PI * 2;
      nodes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: Math.cos(angle) * DRIFT,
        vy: Math.sin(angle) * DRIFT,
        r: 1 + Math.random() * 1.2
      });
    }
  }

  function step(){
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < nodes.length; i++){
      var a = nodes[i];

      // deriva ambiental, lenta y constante
      a.x += a.vx;
      a.y += a.vy;

      // envolver en los bordes
      if (a.x < -10) a.x = W + 10;
      if (a.x > W + 10) a.x = -10;
      if (a.y < -10) a.y = H + 10;
      if (a.y > H + 10) a.y = -10;

      // perturbación del cursor: empuja, no atrae
      if (mouse.active){
        var dx = a.x - mouse.x;
        var dy = a.y - mouse.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < REPEL_RADIUS && dist > 0.001){
          var force = (1 - dist / REPEL_RADIUS);
          a.x += (dx / dist) * force * REPEL_STRENGTH * 0.06;
          a.y += (dy / dist) * force * REPEL_STRENGTH * 0.06;
        }
      }
    }

    // líneas entre nodos cercanos
    ctx.lineWidth = 1;
    for (var i = 0; i < nodes.length; i++){
      for (var j = i + 1; j < nodes.length; j++){
        var a = nodes[i], b = nodes[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK_DIST){
          var op = (1 - dist / LINK_DIST) * 0.16;
          ctx.strokeStyle = 'rgba(237,236,230,' + op.toFixed(3) + ')';
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    // nodos
    ctx.fillStyle = 'rgba(237,236,230,0.55)';
    for (var i = 0; i < nodes.length; i++){
      var a = nodes[i];
      ctx.beginPath();
      ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!reduceMotion) requestAnimationFrame(step);
  }

  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });
  window.addEventListener('mouseleave', function(){
    mouse.active = false;
  });

  window.addEventListener('resize', function(){
    resize();
    makeNodes();
    if (reduceMotion) step();
  });

  resize();
  makeNodes();
  step();
})();
</script>

</body>
</html>
