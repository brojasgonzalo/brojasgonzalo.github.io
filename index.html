<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Gonzalo Bustamante Rojas</title>
<meta name="description" content="Gonzalo Bustamante Rojas — investigador asociado al Centro de Encuestas y Estudios Longitudinales UC.">
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0A0B0E;
    --ink:#EDECE6;
    --ink-soft:#8B8C92;
    --line:#EDECE6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Times New Roman', 'Liberation Serif', Georgia, 'Nimbus Roman', serif;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  @media (max-width: 640px){
    p{ white-space:normal; }
  }

  canvas#net{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
  }

  main{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:8vh 8vw;
  }

  .intro{
    max-width:48rem;
  }

  h1{
    font-weight:700;
    font-size:clamp(1.9rem, 3.8vw, 2.7rem);
    letter-spacing:0.01em;
    margin:0 0 0.3em;
    color:var(--ink);
  }

  .subtitle{
    font-size:0.95rem;
    font-style:italic;
    color:var(--ink-soft);
    margin:0 0 1em;
  }

  p{
    font-weight:400;
    font-size:1.05rem;
    line-height:1.5;
    color:var(--ink-soft);
    margin:0 0 0.3em;
    white-space:nowrap;
  }

  p a{
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    transition:opacity 0.2s;
  }
  p a:hover{opacity:0.6;}

  .contact{
    margin-top:1.6em;
    display:flex;
    flex-wrap:wrap;
    gap:1.4em;
  }
  .contact a{
    display:inline-flex;
    align-items:center;
    gap:0.5em;
    color:var(--ink-soft);
    text-decoration:none;
    font-size:0.85rem;
    letter-spacing:0.02em;
    border-bottom:1px solid transparent;
    transition:color 0.2s, border-color 0.2s;
  }
  .contact a:hover{
    color:var(--ink);
    border-color:var(--ink-soft);
  }
  .contact svg{
    width:15px;
    height:15px;
    flex-shrink:0;
  }

  a:focus-visible{outline:1px solid var(--ink-soft); outline-offset:4px;}
</style>
</head>
<body>

<canvas id="net"></canvas>

<main>
  <div class="intro">
    <h1>Gonzalo Bustamante Rojas</h1>
    <p class="subtitle">29, Santiago de Chile.</p>
    <p>Investigador asociado al <a href="https://encuestas.uc.cl/">Centro de Encuestas y Estudios Longitudinales UC</a>.</p>
    <p>Profesor honorario Universidad Finis Terrae.</p>
    <p>Cientista Familiar (UFT) y Magíster en Sociología (PUC).</p>
    <p>Me gustan los gatos y el shoegaze.</p>

    <div class="contact">
      <a href="mailto:brojasgonzalo@gmail.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>
        Correo
      </a>
      <a href="https://github.com/brojasgonzalo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
        GitHub
      </a>
      <a href="https://www.linkedin.com/in/gonzalo-b-rojas/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
        LinkedIn
      </a>
      <a href="https://www.ciperchile.cl/author/gonzalo-bustamante-rojas/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
        CIPER
      </a>
    </div>
  </div>
</main>

<script>
(function(){
  var canvas = document.getElementById('net');
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W, H, DPR;
  var nodes = [];
  var clock = 0;
  var mouse = { x: -9999, y: -9999, active: false };

  // Nube de puntos en un espacio 3D real (no simulado): cada nodo tiene
  // x, y, z en unidades de "mundo" independientes de los píxeles de
  // pantalla, y se proyecta cada frame con perspectiva real. Encima de
  // esa base hay varias capas independientes: dirección del movimiento
  // (corrientes + remolino), acentos de color, brillo y una lectura tipo
  // HUD cuando el cursor pasa cerca de un nodo. Estos valores quedaron
  // fijos después de afinarlos a mano con un panel de control temporal
  // (3D desactivado a propósito: campo plano con brillo y HUD).
  var CONFIG = {
    nodeCount: 130,
    radiusMin: 1,
    radiusVar: 1.1,
    enable3D: false,
    spread: 0.62,
    camDistFactor: 1.06,
    focalFactor: 0.95,
    wanderForce: 0.004,
    maxSpeed: 0.4,
    damping: 0.985,
    autospin: 0.0009,
    mouseYaw: 0.002,
    mousePitch: 0.5,
    pitchSmooth: 0.04,
    lockZ: true,
    driftX: 0.001,
    driftY: 0,
    driftZ: -0.009,
    orbitStrength: 0.001,
    colorAccents: true,
    linkDistFactor: 0.5,
    linkOpacity: 0.22,
    alphaBase: 0.15,
    alphaScale: 0.55,
    waterEffect: false,
    waterAmplitude: 15,
    waterSpeed: 0.0015,
    glowEffect: true,
    glowAmount: 24,
    hudEffect: true,
    hudRadius: 280,
    hudMax: 5
  };

  // el volumen 3D y varias constantes derivadas se recalculan en cada
  // resize()
  var HALF_X, HALF_Y, HALF_Z, CAM_DIST, FOCAL, LINK_DIST;

  var rot = { y: 0, x: 0 };
  var targetTiltX = 0, targetTiltY = 0;

  function applyDerived(){
    var minDim = Math.min(W, H);
    HALF_X = W * CONFIG.spread;
    HALF_Y = H * CONFIG.spread;
    HALF_Z = minDim * CONFIG.spread;
    CAM_DIST = minDim * CONFIG.camDistFactor;
    FOCAL = minDim * CONFIG.focalFactor;
    LINK_DIST = minDim * CONFIG.linkDistFactor;
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    applyDerived();
  }

  function makeNodes(){
    nodes = [];
    for (var i = 0; i < CONFIG.nodeCount; i++){
      nodes.push({
        x: (Math.random() * 2 - 1) * HALF_X,
        y: (Math.random() * 2 - 1) * HALF_Y,
        z: (Math.random() * 2 - 1) * HALF_Z,
        vx: 0, vy: 0, vz: 0,
        angle: Math.random() * Math.PI * 2,
        axis: Math.random() * Math.PI * 2,
        phase: Math.random() * Math.PI * 2,
        r: CONFIG.radiusMin + Math.random() * CONFIG.radiusVar
      });
    }
  }

  // proyecta un punto del mundo 3D (ya rotado) a coordenadas de pantalla.
  // con el modo 3D apagado no hay perspectiva: todo queda al mismo
  // tamaño, como un campo plano
  function project(p){
    if (!CONFIG.enable3D){
      return { x: W / 2 + p.rx, y: H / 2 + p.ry, scale: 1 };
    }
    var scale = FOCAL / (FOCAL + p.rz + CAM_DIST);
    return {
      x: W / 2 + p.rx * scale,
      y: H / 2 + p.ry * scale,
      scale: scale
    };
  }

  function step(){
    ctx.clearRect(0, 0, W, H);
    clock += 16;

    if (CONFIG.enable3D){
      rot.y += CONFIG.autospin + targetTiltY * CONFIG.mouseYaw;
      rot.x += (targetTiltX - rot.x) * CONFIG.pitchSmooth;
    } else {
      rot.y += (0 - rot.y) * 0.08;
      rot.x += (0 - rot.x) * 0.08;
    }

    var cosY = Math.cos(rot.y), sinY = Math.sin(rot.y);
    var cosX = Math.cos(rot.x), sinX = Math.sin(rot.x);

    // integración física en el espacio 3D real: deriva propia, corriente
    // constante (dirección) y fricción
    for (var i = 0; i < nodes.length; i++){
      var a = nodes[i];
      a.angle += (Math.random() - 0.5) * 0.03;
      a.axis += (Math.random() - 0.5) * 0.03;
      a.vx += Math.cos(a.angle) * Math.cos(a.axis) * CONFIG.wanderForce + CONFIG.driftX;
      a.vy += Math.sin(a.axis) * CONFIG.wanderForce + CONFIG.driftY;
      if (CONFIG.lockZ){
        a.vz = 0;
      } else {
        a.vz += Math.sin(a.angle) * Math.cos(a.axis) * CONFIG.wanderForce + CONFIG.driftZ;
      }

      a.vx *= CONFIG.damping; a.vy *= CONFIG.damping; a.vz *= CONFIG.damping;
      var speed = Math.sqrt(a.vx * a.vx + a.vy * a.vy + a.vz * a.vz);
      if (speed > CONFIG.maxSpeed){
        var k = CONFIG.maxSpeed / speed;
        a.vx *= k; a.vy *= k; a.vz *= k;
      }

      a.x += a.vx; a.y += a.vy; a.z += a.vz;

      // remolino: rotación constante de la posición alrededor del eje Y
      if (CONFIG.orbitStrength !== 0){
        var rad = Math.sqrt(a.x * a.x + a.z * a.z);
        var ang = Math.atan2(a.z, a.x) + CONFIG.orbitStrength;
        a.x = Math.cos(ang) * rad;
        a.z = Math.sin(ang) * rad;
      }

      // los bordes envuelven (no rebotan) para que las corrientes y el
      // remolino se vean como un flujo continuo, no como un rebote
      if (a.x < -HALF_X) a.x += 2 * HALF_X;
      if (a.x > HALF_X) a.x -= 2 * HALF_X;
      if (a.y < -HALF_Y) a.y += 2 * HALF_Y;
      if (a.y > HALF_Y) a.y -= 2 * HALF_Y;
      if (a.z < -HALF_Z) a.z += 2 * HALF_Z;
      if (a.z > HALF_Z) a.z -= 2 * HALF_Z;

      // rotación de cámara alrededor de Y y luego de X
      var x1 = a.x * cosY - a.z * sinY;
      var z1 = a.x * sinY + a.z * cosY;
      var y1 = a.y * cosX - z1 * sinX;
      var z2 = a.y * sinX + z1 * cosX;

      a.rx = x1; a.ry = y1; a.rz = z2;
      var proj = project(a);
      a.sx = proj.x; a.sy = proj.y; a.sc = proj.scale;

      // agua: vaivén sinusoidal aplicado ya en pantalla, así que también
      // arrastra las líneas que llegan a este nodo
      if (CONFIG.waterEffect){
        a.sy += Math.sin(clock * CONFIG.waterSpeed + a.phase) * CONFIG.waterAmplitude;
      }
    }

    var baseRGB = CONFIG.waterEffect ? '196,222,255' : '237,236,230';

    // líneas: distancia real en el espacio 3D rotado, así que solo se
    // conectan nodos que de verdad están cerca en profundidad, no solo
    // superpuestos en pantalla
    ctx.lineWidth = 1;
    for (var i = 0; i < nodes.length; i++){
      var a = nodes[i];
      for (var j = i + 1; j < nodes.length; j++){
        var b = nodes[j];
        var dx = a.rx - b.rx, dy = a.ry - b.ry, dz = a.rz - b.rz;
        var dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (dist > LINK_DIST) continue;

        var opScale = (a.sc + b.sc) * 0.5;
        var op = (1 - dist / LINK_DIST) * CONFIG.linkOpacity * Math.min(1, opScale * 0.9);
        var rgb = baseRGB;
        if (CONFIG.colorAccents){
          var key = (i * 7 + j * 13) % 10;
          if (key === 8) rgb = '138,164,214';
          else if (key === 9) rgb = '196,150,120';
        }
        ctx.strokeStyle = 'rgba(' + rgb + ',' + Math.max(0, op).toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(a.sx, a.sy);
        ctx.lineTo(b.sx, b.sy);
        ctx.stroke();
      }
    }

    // nodos: de atrás hacia adelante, para que los cercanos —agrandados
    // por la perspectiva— tapen a los lejanos, como corresponde en 3D
    var ordered = nodes.slice().sort(function(p, q){ return p.rz - q.rz; });
    ctx.shadowBlur = CONFIG.glowEffect ? CONFIG.glowAmount : 0;
    ctx.shadowColor = 'rgba(' + baseRGB + ',0.9)';
    for (var i = 0; i < ordered.length; i++){
      var a = ordered[i];
      var alpha = Math.max(0.08, Math.min(0.85, CONFIG.alphaBase + a.sc * CONFIG.alphaScale));
      var radius = Math.max(0.4, a.r * a.sc);
      ctx.fillStyle = 'rgba(' + baseRGB + ',' + alpha.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(a.sx, a.sy, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // HUD cibernético: al pasar el cursor cerca de nodos, los marca y
    // etiqueta la distancia (en píxeles) entre el cursor y cada uno
    if (CONFIG.hudEffect && mouse.active){
      var near = [];
      for (var hi = 0; hi < nodes.length; hi++){
        var hn = nodes[hi];
        var hdx = hn.sx - mouse.x, hdy = hn.sy - mouse.y;
        var hdist = Math.sqrt(hdx * hdx + hdy * hdy);
        if (hdist <= CONFIG.hudRadius) near.push({ n: hn, d: hdist });
      }
      near.sort(function(p, q){ return p.d - q.d; });
      near = near.slice(0, CONFIG.hudMax);

      ctx.font = '10px ui-monospace, SFMono-Regular, Consolas, monospace';
      ctx.textBaseline = 'middle';
      for (var hi = 0; hi < near.length; hi++){
        var hn = near[hi].n, hd = near[hi].d;
        ctx.strokeStyle = 'rgba(140,220,255,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(mouse.x, mouse.y);
        ctx.lineTo(hn.sx, hn.sy);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(140,220,255,0.85)';
        ctx.strokeRect(hn.sx - 5, hn.sy - 5, 10, 10);

        var mx = (mouse.x + hn.sx) / 2, my = (mouse.y + hn.sy) / 2;
        ctx.fillStyle = 'rgba(140,220,255,0.9)';
        ctx.fillText(hd.toFixed(1), mx + 4, my);
      }

      ctx.strokeStyle = 'rgba(140,220,255,0.6)';
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 3, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (!reduceMotion) requestAnimationFrame(step);
  }

  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    targetTiltX = (e.clientY / H - 0.5) * CONFIG.mousePitch;
    targetTiltY = (e.clientX / W - 0.5);
    if (reduceMotion) step();
  });
  window.addEventListener('mouseleave', function(){
    mouse.active = false;
    targetTiltX = 0;
    targetTiltY = 0;
  });

  window.addEventListener('resize', function(){
    resize();
    makeNodes();
    if (reduceMotion) step();
  });

  resize();
  makeNodes();
  step();
})();
</script>

</body>
</html>
